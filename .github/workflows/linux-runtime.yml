# Linux build (BUILDING_LINUX.md): compile and link the host runtime alone and run the platform self-test. Only the runtime's
# own sources: no dump, no game files, nothing derived from the game (none is ever on a runner).
name: Linux runtime

on:
  push:
    paths: ['runtime/**', 'fighter_sdk/**', 'tests/plat_selftest.c', 'tools/lifter/build.py', 'tools/lifter/build_nro.py', 'scripts/macos/host_check.py', 'scripts/setup.py', '.github/workflows/linux-runtime.yml']
  pull_request:
    paths: ['runtime/**', 'fighter_sdk/**', 'tests/plat_selftest.c', 'tools/lifter/build.py', 'tools/lifter/build_nro.py', 'scripts/macos/host_check.py', 'scripts/setup.py', '.github/workflows/linux-runtime.yml']
  workflow_dispatch:

jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # clang 19+ (C23 typeof_unqual in plat/windows.h); SDL3 is not packaged for Ubuntu 24.04: built from its release tag
      - name: Dependencies (apt, SDL3 from source, Khronos headers, Mii reference sources)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-19 lld-19 cmake ninja-build pkg-config libfreetype-dev libssl-dev libavformat-dev libavcodec-dev \
            libswscale-dev libswresample-dev libavutil-dev glslang-dev libvulkan-dev libgl-dev libopus0 \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libwayland-dev libxkbcommon-dev libpulse-dev libasound2-dev libdrm-dev libgbm-dev
          git -c advice.detachedHead=false clone --quiet --depth 1 --branch release-3.2.24 https://github.com/libsdl-org/SDL.git deps/SDL
          cmake -S deps/SDL -B deps/SDL/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF > /dev/null
          cmake --build deps/SDL/build > /dev/null
          sudo cmake --install deps/SDL/build > /dev/null
          sudo ldconfig
          python -m pip install --quiet Pillow
          git -c advice.detachedHead=false clone --quiet --depth 1 --branch v1.4.351 https://github.com/KhronosGroup/Vulkan-Headers.git deps/Vulkan-Headers
          git clone --quiet --depth 1 --filter=blob:none --sparse https://git.eden-emu.dev/eden-emu/eden.git deps/suyu
          git -C deps/suyu sparse-checkout set src/core/hle/service/mii
          clang-19 --version
          pkg-config --modversion sdl3

      - name: Compile the host runtime (and a stand-in module .so)
        run: python scripts/macos/host_check.py --target linux --clang clang-19 --vulkan-headers deps/Vulkan-Headers --suyu deps/suyu

      - name: Build and run the platform self-test
        working-directory: runtime
        run: |
          clang-19 -O1 -w -include plat/plat_pre.h -I plat $(pkg-config --cflags sdl3 openssl) ../tests/plat_selftest.c plat_posix.c \
            -o plat_selftest $(pkg-config --libs sdl3 openssl) -lpthread -ldl -lm
          ./plat_selftest
